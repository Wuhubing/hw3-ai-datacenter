<text x="345" y="635" fill="#b36a4e" font-size="13">Grid outage / failed transfer: checkpoint, shed noncritical jobs, restore in priority order</text>
<path d="M45 660H1155" stroke="#cbd7ca"/><g font-size="13"><text x="45" y="689">FAILURE CASE 1</text><text x="230" y="689">Loss of one transformer: remaining 8 MVA path must carry 6.25 MW without overload.</text><text x="45" y="716">FAILURE CASE 2</text><text x="230" y="716">48-hour outage: 300 MWh, fuel logistics, cooling and black-start tests required. Uptime unverified.</text></g></g></svg>
