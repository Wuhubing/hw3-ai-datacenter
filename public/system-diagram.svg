<g font-size="17"><text x="65" y="203">Utility connection</text><text x="365" y="184">Transformer A / 8 MVA</text><text x="365" y="274">Transformer B / 8 MVA</text><text x="680" y="232">Separate A/B buses</text><text x="960" y="232">UPS and rack PDUs</text><text x="65" y="382">5 × 2 MW generators</text><text x="365" y="386">Cooling pumps / CDUs</text><text x="680" y="390">IT / 5 MW</text><text x="960" y="395">Storage + checkpoints</text><text x="365" y="530">Dry heat rejection</text><text x="680" y="530">Redundant network</text><text x="960" y="530">Two diverse carriers</text></g>
<g font-size="13" fill="#728073"><text x="65" y="229">Date, tariff, upgrades unknown</text><text x="365" y="205">Each path can carry site at PF .95</text><text x="365" y="295">Separate protection required</text><text x="680" y="257">Transfer + interlocks</text><text x="680" y="280">Shared upstream risk remains</text><text x="960" y="257">15-minute bridge / N+1</text><text x="960" y="280">≥1.56 MWh delivered</text><text x="65" y="405">4 required / 1 spare</text><text x="65" y="430">Fuel assumption: 90,000 L</text><text x="365" y="414">N+1 / backed by standby power</text><text x="680" y="418">GPU + host + network</text><text x="960" y="424">Replication / restore testing</text><text x="365" y="555">Seasonal PUE unverified</text><text x="680" y="555">Independent power paths</text><text x="960" y="555">Physical route diversity</text></g>
